[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-intelligence-system"
version = "0.1.0"
description = "An end-to-end customer intelligence system covering segmentation, churn prediction, deployment, and GenAI-assisted decision support."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["customer_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]